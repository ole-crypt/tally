<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tally</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100vh; background: #000; overflow-x: hidden; }
        #svg { display: block; width: 100vw; min-height: 100vh; }
        .m { stroke: #fff; stroke-linecap: round; fill: none; }
        .a {
            stroke-dasharray: var(--l);
            stroke-dashoffset: var(--l);
            animation: draw var(--dur) ease-out var(--del) forwards;
        }
        @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
</head>
<body>
<svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
(() => {
    // ═══ CONFIG ═══
    const INTERVAL = 1000;                                    // 1 mark per second
    const BIRTH = new Date('2026-03-09T22:38:00').getTime();  // birth date

    const GH = 1.7, GAP = 0.5;
    const svg = document.getElementById('svg');
    const ns = 'http://www.w3.org/2000/svg';

    const rand = s => {
        const x = Math.sin(s * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
    };

    let renderedCount = 0;
    let layout = null;
    let isFirstRender = true;
    let isProgressive = false;
    let progressiveId = 0;

    // ═══ Layout calculator ═══
    const MIN_U = 25; // minimum group width before scrolling kicks in

    function calcLayout(numGroups) {
        const W = window.innerWidth;
        const vH = window.innerHeight;
        const PAD = Math.min(W, vH) * 0.04;
        const aW = W - PAD * 2;
        const aH = vH - PAD * 2;

        // Try to fit everything on one screen (shrink to fit)
        let bestU = 0, bestC = 1;
        const est = Math.max(1, Math.round(Math.sqrt(numGroups * aW / (aH * GH))));
        for (let c = Math.max(1, est - 50); c <= Math.min(numGroups, est + 50); c++) {
            const r = Math.ceil(numGroups / c);
            const u = Math.min(
                aW / (c + (c - 1) * GAP),
                aH / (r * GH + (r - 1) * GAP)
            );
            if (u > bestU) { bestU = u; bestC = c; }
        }

        if (bestU >= MIN_U) {
            // Fits on one screen at readable size
            const cols = bestC;
            const rows = Math.ceil(numGroups / cols);
            const u = bestU;
            const gridW = cols * u + (cols - 1) * u * GAP;
            const gridH = rows * u * GH + (rows - 1) * u * GAP;
            return {
                W, H: vH, u, cols, rows,
                ox: (W - gridW) / 2,
                oy: (vH - gridH) / 2,
                sw: Math.max(1.2, u * 0.05)
            };
        }

        // Too many marks — scroll mode with minimum size
        const cols = Math.min(numGroups, Math.max(3, Math.floor(aW / (MIN_U * (1 + GAP)))));
        const u = aW / (cols + (cols - 1) * GAP);
        const rows = Math.ceil(numGroups / cols);
        const gridW = cols * u + (cols - 1) * u * GAP;
        const gridH = rows * u * GH + (rows - 1) * u * GAP;
        const totalH = Math.max(vH, gridH + PAD * 2);

        return {
            W, H: totalH, u, cols, rows,
            ox: (W - gridW) / 2,
            oy: PAD,
            sw: Math.max(1.2, u * 0.05)
        };
    }

    // ═══ Create a single mark SVG element ═══
    function createMark(markIndex, lay, animate, animDelay) {
        const groupIndex = Math.floor(markIndex / 5);
        const posInGroup = markIndex % 5;
        const col = groupIndex % lay.cols;
        const row = Math.floor(groupIndex / lay.cols);
        const gx = lay.ox + col * lay.u * (1 + GAP);
        const gy = lay.oy + row * lay.u * (GH + GAP);
        const gh = lay.u * GH;
        const u = lay.u;

        let x1, y1, x2, y2, dur;

        if (posInGroup < 4) {
            const vPos = [0.15, 0.38, 0.62, 0.85];
            const r1 = rand(markIndex) - 0.5;
            const r2 = rand(markIndex + 7e3) - 0.5;
            const r3 = rand(markIndex + 5e3) - 0.5;
            const r4 = rand(markIndex + 3e3) - 0.5;

            x1 = gx + u * vPos[posInGroup] + r1 * u * 0.04;
            y1 = gy + r2 * gh * 0.04;
            x2 = gx + u * vPos[posInGroup] + r3 * u * 0.05;
            y2 = gy + gh + r4 * gh * 0.04;
            dur = '0.25s';
        } else {
            const r1 = rand(markIndex) - 0.5;
            const r2 = rand(markIndex + 7e3) - 0.5;

            x1 = gx - u * 0.03 + r1 * u * 0.03;
            y1 = gy + gh * 0.82 + r2 * gh * 0.04;
            x2 = gx + u * 1.03 + r1 * u * 0.03;
            y2 = gy + gh * 0.15 + r2 * gh * 0.04;
            dur = '0.2s';
        }

        const len = Math.hypot(x2 - x1, y2 - y1);
        const lsw = lay.sw + (rand(markIndex + 9e3) - 0.5) * lay.sw * 0.2;

        const el = document.createElementNS(ns, 'line');
        el.setAttribute('x1', x1);
        el.setAttribute('y1', y1);
        el.setAttribute('x2', x2);
        el.setAttribute('y2', y2);
        el.setAttribute('stroke-width', lsw);

        if (animate) {
            el.setAttribute('class', 'm a');
            el.style.setProperty('--l', len);
            el.style.setProperty('--dur', dur);
            el.style.setProperty('--del', (animDelay || 0) + 's');
        } else {
            el.setAttribute('class', 'm');
        }

        return el;
    }

    function setSvgSize(lay) {
        svg.setAttribute('viewBox', `0 0 ${lay.W} ${lay.H}`);
        svg.style.height = lay.H + 'px';
    }

    // ═══ Instant full re-render ═══
    function instantRender(totalMarks, newLayout) {
        svg.innerHTML = '';
        setSvgSize(newLayout);
        layout = newLayout;
        const frag = document.createDocumentFragment();
        for (let i = 0; i < totalMarks; i++) {
            frag.appendChild(createMark(i, layout, false));
        }
        svg.appendChild(frag);
        renderedCount = totalMarks;
    }

    // ═══ Progressive wave render (first load) ═══
    function waveRender(totalMarks, newLayout) {
        progressiveId++;
        const myId = progressiveId;
        isProgressive = true;

        svg.innerHTML = '';
        setSvgSize(newLayout);
        layout = newLayout;

        const DURATION = 3000;
        const BATCHES = 60;
        const batchSize = Math.max(1, Math.ceil(totalMarks / BATCHES));
        const batchDelay = DURATION / BATCHES;
        let idx = 0;

        function addBatch() {
            if (myId !== progressiveId) return; // cancelled
            const frag = document.createDocumentFragment();
            const end = Math.min(idx + batchSize, totalMarks);
            for (; idx < end; idx++) {
                frag.appendChild(createMark(idx, layout, true, 0));
            }
            svg.appendChild(frag);
            renderedCount = idx;
            if (idx < totalMarks) {
                setTimeout(addBatch, batchDelay);
            } else {
                isProgressive = false;
            }
        }
        addBatch();
    }

    // ═══ Main render loop ═══
    function render() {
        if (isProgressive) return;
        const totalMarks = Math.max(0, Math.floor((Date.now() - BIRTH) / INTERVAL));
        if (totalMarks <= renderedCount) return;
        if (totalMarks === 0) return;

        const numGroups = Math.ceil(totalMarks / 5);
        const newLayout = calcLayout(numGroups);

        const canIncrement = layout &&
            newLayout.cols === layout.cols &&
            Math.abs(newLayout.u - layout.u) < 0.1;

        if (isFirstRender) {
            // First load: progressive wave animation
            waveRender(totalMarks, newLayout);
            isFirstRender = false;
        } else if (!canIncrement) {
            // Layout changed: instant re-render
            instantRender(totalMarks, newLayout);
        } else {
            // Same layout: append new mark with animation
            for (let i = renderedCount; i < totalMarks; i++) {
                svg.appendChild(createMark(i, layout, true, 0));
            }
            // Grow SVG if new rows added
            if (newLayout.H > layout.H) {
                layout.rows = newLayout.rows;
                layout.H = newLayout.H;
                setSvgSize(layout);
            }
            renderedCount = totalMarks;
        }
    }

    render();

    setInterval(render, 250);

    window.addEventListener('resize', () => {
        progressiveId++;     // cancel any wave in progress
        isProgressive = false;
        renderedCount = 0;
        layout = null;
        isFirstRender = false;
        render();
    });
})();
</script>
</body>
</html>
